            document.getElementById('rotateFull').addEventListener('click', startLandscapeFullscreen);

            // Use visualViewport: excludes mobile browser URL and bottom toolbars.
            // The map always stays 800:576, with spare space around it instead of stretching.
            function fitGameToVisibleArea() {
                const viewport = window.visualViewport;
                const availableWidth = viewport ? viewport.width : window.innerWidth;
                const availableHeight = viewport ? viewport.height : window.innerHeight;
                const margin = 12;
                const scale = Math.min((availableWidth - margin * 2) / 800, (availableHeight - margin * 2) / 576, 1.8);
                const gameFrame = document.getElementById('frame');
                gameFrame.style.setProperty('width', Math.floor(800 * Math.max(scale, .1)) + 'px', 'important');
                gameFrame.style.setProperty('height', Math.floor(576 * Math.max(scale, .1)) + 'px', 'important');
                const root = document.querySelector('.wrap');
                root.style.setProperty('width', availableWidth + 'px', 'important');
                root.style.setProperty('height', availableHeight + 'px', 'important');
                root.style.left = (viewport ? viewport.offsetLeft : 0) + 'px';
                root.style.top = (viewport ? viewport.offsetTop : 0) + 'px';
            }
            window.addEventListener('resize', fitGameToVisibleArea);
            window.addEventListener('orientationchange', fitGameToVisibleArea);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', fitGameToVisibleArea);
                window.visualViewport.addEventListener('scroll', fitGameToVisibleArea);
            }
            fitGameToVisibleArea();
            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>
