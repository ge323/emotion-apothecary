<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>마음의 약국 v3.0 · 벽 충돌 수정</title>
    <style>
:root { color-scheme:dark; --bg:#181724; --panel:#3c2c47; --gold:#d7a77f; }
* { box-sizing:border-box; }
html,body { margin:0; width:100%; min-height:100%; background:var(--bg); color:#fff1d8; font-family:system-ui,'Malgun Gothic',sans-serif; }
body { min-height:100dvh; display:flex; justify-content:center; overscroll-behavior-y:contain; }
button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
html,body,.wrap,.frame,.hud,.top { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
body { overflow-x:hidden; }
canvas { -webkit-user-select:none; user-select:none; touch-action:none; }
.wrap { width:min(100%,440px); min-height:100dvh; padding: max(9px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
.top { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:35px; }
.top h1 { font-size:17px; margin:0; white-space:nowrap; }
.version { font-size:10px; color:#d8b8cf; vertical-align:middle; }
.top-right { display:flex; align-items:center; gap:6px; min-width:0; }
@media(max-width:380px) { .top { flex-wrap:wrap; } .top-right { width:100%; justify-content:space-between; } }
.top small { color:#e2c4ac; font-size:10px; white-space:nowrap; }
#soundBtn { color:#fff1d8; background:#46334d; border:1px solid #a47c91; border-radius:8px; font-size:11px; padding:7px 8px; white-space:nowrap; }
.frame { position:relative; width:100%; aspect-ratio:4 / 5; flex:none; overflow:hidden; border:4px solid #614357; border-radius:11px; background:#302536; box-shadow:0 6px 20px #08071166; isolation:isolate; }
#game { display:block; width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
.focusShade { position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 55px 12px #180e25a6; opacity:0; transition:opacity .3s; }
.frame.focus .focusShade { opacity:1; }
.touch { position:absolute; z-index:5; bottom:12px; left:7px; right:7px; display:flex; justify-content:space-between; align-items:flex-end; gap:8px; pointer-events:none; user-select:none; }
.touch button { pointer-events:auto; touch-action:none; background:#493751df; border:1px solid #e0b58e; border-radius:8px; color:#fff7e7; font-weight:700; }
.dpad { touch-action:none; -webkit-user-select:none; user-select:none; display:grid; grid-template-columns:repeat(3,clamp(42px,12vw,54px)); gap:3px; }
.dpad .empty { visibility:hidden; }
.dpad button { height:clamp(42px,12vw,54px); padding:0; font-size:15px; touch-action:none; }
.dpad button.pressed { background:#a7789a; border-color:#fff1bc; transform:scale(.97); }
.touch .act { width:clamp(112px,32vw,150px); min-height:52px; font-size:12px; padding:5px; }
.touch .act.ready { background:#97648c; border-color:#ffe3a9; }
.touch .act:disabled { opacity:.65; }
.hud { display:flex; flex-direction:column; gap:7px; font-size:12px; }
.pill { background:#302638; border:1px solid #74536b; color:#eed9cb; border-radius:9px; padding:9px 11px; }
.hud .help { font-size:11px; color:#cbb5c2; }
#nextGuest { color:#ffe1bd; text-align:center; }
.game-topbar,.rotate-hint,.prompt { display:none!important; }
.reaction-bubble { position:absolute; z-index:7; top:12%; left:50%; transform:translate(-50%,-8px); background:#fff1d5; color:#473347; border:2px solid #9c7586; border-radius:9px; padding:6px 10px; font-size:11px; font-weight:700; text-align:center; max-width:85%; opacity:0; pointer-events:none; transition:opacity .25s,transform .25s; }
.reaction-bubble.show { opacity:1; transform:translate(-50%,0); }
.overlay { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:12px; background:#100c19bb; }
.modal { width:min(100%,390px); max-height:min(82dvh,670px); overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:thin; text-align:left; background:var(--panel); border:3px solid var(--gold); border-radius:12px; box-shadow:0 10px 0 #201626; padding:14px; }
.modal h2 { margin:0 0 8px; font-size:17px; color:#ffddab; line-height:1.3; }
.modal p { font-size:12px; line-height:1.5; color:#f2d8d4; margin:8px 0; }
.modal button { background:#846082; border:2px solid #d7a77f; color:white; border-radius:8px; font-size:12px; font-weight:700; padding:9px; }
.modal button:active { background:#b47d92; }
.modal .row { display:flex; gap:10px; align-items:center; }
.modal .row>div { min-width:0; }
.portrait { width:56px; height:56px; flex:0 0 56px; image-rendering:pixelated; background:#6c4b64; border:2px solid #ba91a3; border-radius:8px; }
.note { font-size:11px; color:#e7c6b5; }
.dialogue { background:#281f35; border:2px solid #9c7586; border-radius:9px; padding:10px; margin:9px 0; line-height:1.55; font-size:13px; }
.bar { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.bar span { background:#4c3854; border-radius:8px; padding:5px 9px; font-size:11px; }
.hint { color:#ffdda9!important; }
.choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin:9px 0; max-height:min(27dvh,195px); overflow-y:auto; overflow-x:hidden; padding:2px; }
.choices button { min-width:0; font-size:12px; padding:8px 6px; text-align:left; }
.choices button.selected { background:#c18d91; border-color:#fff0ba; color:#261b2b; }
.modal .action { display:block; width:100%; margin-top:8px; background:#b17a8c; }
.modal .action:disabled { opacity:.45; cursor:not-allowed; }
#dismiss { margin-top:7px; }
@media (max-height:650px) { .wrap { gap:6px; } .modal { max-height:90dvh; padding:11px; } .choices { max-height:24dvh; } }
@media (orientation:landscape) { .wrap { width:min(100%,440px); } .frame { max-width:410px; margin-inline:auto; } .touch .act { min-height:46px; } .dpad { grid-template-columns:repeat(3,44px); } .dpad button { height:44px; } .modal { max-height:88dvh; } }

/* v2.4: prevent browser text selection, drag ghost, touch scrolling on pad */
.dpad, .dpad * { touch-action:none!important; user-select:none!important; -webkit-user-select:none!important; -webkit-touch-callout:none!important; -webkit-user-drag:none!important; }
.dpad { position:relative; pointer-events:auto; }
.dpad button { appearance:none; -webkit-appearance:none; }
/* Shop controls and purchased decorations */
.shop-launch { width:100%; border:1px solid #d7a77f; background:#61435f; color:#fff0d6; border-radius:9px; padding:11px; font-weight:800; font-size:13px; }
.shop-tabs { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:12px 0; }
.shop-tabs button.active { background:#d7a77f; color:#342339; }
.shop-list { display:grid; gap:9px; max-height:44dvh; overflow-y:auto; }
.shop-item { background:#2b2238; border:1px solid #87637d; border-radius:10px; padding:10px; display:flex; align-items:center; gap:10px; }
.shop-icon { font-size:25px; width:37px; flex:0 0 37px; text-align:center; }
.shop-detail { flex:1; min-width:0; }
.shop-detail strong { font-size:13px; color:#ffdfb3; }
.shop-detail p { margin:4px 0 0; font-size:11px; }
.shop-item button { flex:0 0 auto; padding:8px; font-size:11px; }
.shop-item button:disabled { opacity:.5; }
.shop-balance { color:#ffe0a4; font-weight:800; }

/* v2.9 — tactile potion crafting workbench */
.research-scene {display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,#352944,#5b3b58);border:2px solid #9f7994;border-radius:12px;padding:10px;margin:10px 0;min-height:100px;}
.research-witch {display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 55px;}
.research-witch canvas {width:58px;height:68px;image-rendering:pixelated;}
.research-witch small,.research-caption {font-size:11px;color:#ffdfb4;}
.research-cauldron {width:84px;text-align:center;flex:0 0 84px;position:relative;}
.steam {color:#e5b8ee;font-size:15px;animation:floatSteam 1.8s ease-in-out infinite alternate;}
.cauldron-rim {height:13px;background:#b59acf;border:4px solid #31283f;border-radius:50%;margin:0 5px -4px;position:relative;z-index:1;}
.cauldron-body {height:47px;background:linear-gradient(#8a6ba3,#4d3a6a);border:4px solid #30253f;border-radius:8px 8px 35px 35px;color:#d7b9ff;padding-top:8px;}
.cauldron-fire {color:#ffc77c;margin-top:-5px;font-size:17px;}
@keyframes floatSteam {to{transform:translateY(-5px);opacity:.5}}
.recipe-grid {display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 23px minmax(0,1fr);gap:4px;align-items:center;background:#261f35;padding:9px 6px;border:2px solid #8c708a;border-radius:11px;}
.recipe-slot {min-width:0;min-height:95px;background:#48344f;border:2px dashed #b3909f;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px;}
.recipe-slot small {font-size:10px;color:#f5dbcb;text-align:center;word-break:keep-all;}
.recipe-plus,.recipe-arrow {font-weight:900;color:#ffdaaa;text-align:center;font-size:20px;}
.result-slot {background:#554361;}
.empty-slot {font-size:28px;color:#a78fa6;}
.bottle {width:43px;height:53px;display:inline-flex;position:relative;flex:0 0 auto;align-items:center;justify-content:center;margin:4px auto 0;}
.bottle:before {content:'';position:absolute;left:6px;right:6px;top:13px;bottom:2px;background:#e3d9ed;border:3px solid #332c44;border-radius:8px 8px 13px 13px;}
.bottle-neck {position:absolute;top:2px;left:14px;width:15px;height:15px;background:#d5b58d;border:3px solid #382d3c;z-index:2;border-radius:2px;}
.bottle-liquid {position:absolute;left:11px;right:11px;top:27px;bottom:7px;background:var(--liquid,#a68ac7);border-radius:3px 3px 8px 8px;z-index:1;}
.bottle-spark {position:relative;z-index:3;font-size:16px;filter:drop-shadow(0 1px 1px #332339);margin-top:17px;}
.bottle.small {transform:scale(.86);margin:-1px auto -5px;}
.potion-inventory {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-height:180px;overflow-y:auto;margin:8px 0 12px;}
.modal .potion-tile {min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 8px;background:#4c3a58;border:2px solid #8e718b;}
.modal .potion-tile.selected {background:#906b8c;border-color:#ffdb9f;}
.potion-label {font-size:11px;color:#fff1db;}
.research-subtitle {font-size:12px;font-weight:800;color:#ffe0b5;margin-top:12px;display:flex;justify-content:space-between;}
.research-subtitle span {font-weight:500;color:#d5bfd0;}
@media(max-width:350px){.research-caption{font-size:10px}.research-scene{gap:6px}.research-cauldron{width:72px;flex-basis:72px}.potion-inventory{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* v3.1 camera viewport and BGM controls */
.frame{aspect-ratio:3 / 4}
#game{object-fit:fill}
#musicSelect{color:#fff1d8;background:#46334d;border:1px solid #a47c91;border-radius:8px;font-size:11px;padding:7px 8px;white-space:nowrap}
.music-panel[hidden]{display:none!important}
.music-panel{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;background:#100c19dc}
.music-dialog{width:min(100%,390px);background:#3c2c47;border:3px solid #d7a77f;border-radius:14px;padding:18px;color:#fff1d8;box-shadow:0 12px 30px #0008}
.music-dialog h2{margin:0 0 8px;font-size:19px}.music-dialog p{font-size:12px;line-height:1.5;color:#ebd1d9}
#musicOptions{display:grid;gap:8px;margin:16px 0}
#musicOptions button,.music-actions button{padding:11px 9px;border-radius:8px;border:1px solid #b992a1;background:#60465e;color:#fff1d8;text-align:left}
#musicOptions button.selected{background:#ad7890;border:2px solid #ffe1a7}
.music-actions{display:flex;gap:9px}.music-actions button{flex:1;text-align:center}
@media(orientation:landscape){.wrap{width:min(100%,820px)}.frame{aspect-ratio:800 / 576;max-width:800px}.touch{bottom:9px}.dpad button{height:40px}.dpad{grid-template-columns:repeat(3,40px)}}
@media(max-width:390px){.top h1{font-size:15px}.top-right{gap:3px}#musicSelect,#soundBtn{padding:6px 5px;font-size:10px}}
</style>
</head>
<body>
    <main class="wrap">
     <div class="top">
      <h1>
       🧪 마음의 약국 <span class="version">v3.1</span>
      </h1>
      <div class="top-right"><small id="day">
       DAY 01 · 영업 중
      </small>
       <button id="musicSelect" type="button" aria-label="배경음악 선택">🎼 BGM</button><button id="soundBtn" type="button" aria-label="음악과 효과음 켜기">♫ 소리 켜기</button>
      </div>
     </div>
     <div class="frame" id="frame">
      <canvas aria-label="탑뷰 픽셀아트 감정 약국" height="640" id="game" width="480">
      </canvas>
      <div class="focusShade">
      </div>
      <div id="reactionBubble" class="reaction-bubble" aria-live="polite"></div>
      <div class="overlay" id="overlay">
       <section class="modal" id="modal">
       </section>
      </div>
     <div class="touch">
      <div class="dpad">
       <span class="empty">
       </span>
       <button data-key="ArrowUp">
        ▲
       </button>
       <span class="empty">
       </span>
       <button data-key="ArrowLeft">
        ◀
       </button>
       <button data-key="ArrowDown">
        ▼
       </button>
       <button data-key="ArrowRight">
        ▶
       </button>
      </div>
      <button class="act" id="touchE" disabled>다가가 주세요</button>
     </div>
     </div>
     <div class="hud">
      <button class="shop-launch" id="openShop" type="button">🏠 약국 상점 · 인테리어 / 물약 구매</button>
      <div class="pill" id="mission" aria-live="polite">오늘의 미션 준비 중...</div>
      <div class="pill">
       ⌨️ WASD / 방향키 이동 · 가까이 가면 오른쪽 버튼으로 상호작용
      </div>
      <div class="pill" id="status">
       손님을 기다리거나 가마솥에서 연구하세요
      </div>
      <button class="pill" id="nextGuest" style="color:#ffe1bd;cursor:pointer">
       🔔 다음 손님 부르기
      </button>
     </div>
    </main>
    <div id="musicPanel" class="music-panel" hidden><section class="music-dialog" role="dialog" aria-modal="true" aria-label="배경음악 설정"><h2>🎼 약국의 음악</h2><p>원하는 분위기를 골라 보세요. 음악은 직접 만든 반복 멜로디예요.</p><div id="musicOptions"></div><div class="music-actions"><button id="musicToggle" type="button">음악 켜기</button><button id="musicClose" type="button">닫기</button></div></section></div>
    <script>
        (() => {
            'use strict';
            const c = document.getElementById('game'), ctx = c.getContext('2d');
            if (!c || !ctx) { document.body.insertAdjacentHTML("beforeend", "<p>게임 화면을 불러올 수 없습니다.</p>"); return; }
            ctx.imageSmoothingEnabled = false;
            const actionButton = document.getElementById('touchE'), overlay = document.getElementById('overlay'), status = document.getElementById('status');
            const W = 800, H = 576, T = 32;
            const reactionBubble = document.getElementById('reactionBubble');
            const miniDay = { set textContent(value) {} };
            let reactionUntil = 0, guestMood = 'normal';
            // Original procedural soundtrack: no external files or network required.
            // Browsers require a real user gesture before audio playback can start.
            const soundButton = document.getElementById('soundBtn');
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            let audioContext = null;
            let musicBus = null;
            let effectsBus = null;
            let soundEnabled = false;
            let musicTimer = null;
            let nextMusicTime = 0;
            let musicStep = 0;
            let MUSIC_STEP = 60 / 84 / 2; // 84 BPM, eighth notes
            let melody = [
                0, null, 4, null, 7, null, 4, 2,
                5, null, 9, 7, 4, null, 2, null,
                0, null, 4, 7, 9, null, 7, 4,
                2, null, 5, 4, 2, null, 0, null
            ];
            let bassNotes = [0, 5, 9, 7];
            const noteHz = midi => 440 * Math.pow(2, (midi - 69) / 12);
            const tracks = [
              {id:'cozy',name:'🌙 포근한 마법 약국',bpm:84,pitch:0,wave:'sine',mel:[0,null,4,null,7,null,4,2,5,null,9,7,4,null,2,null,0,null,4,7,9,null,7,4,2,null,5,4,2,null,0,null],bass:[0,5,9,7]},
              {id:'forest',name:'🌿 요정의 숲',bpm:96,pitch:12,wave:'sine',mel:[0,7,9,null,12,9,7,null,5,9,12,14,12,null,9,null,4,7,11,14,11,7,4,null,2,5,9,12,9,5,2,null],bass:[0,5,4,2]},
              {id:'rain',name:'🌧️ 비 오는 약국',bpm:68,pitch:-2,wave:'triangle',mel:[0,null,null,3,7,null,3,null,5,null,3,null,0,null,null,null,2,null,5,null,7,5,2,null,0,null,3,null,2,null,0,null],bass:[0,5,7,3]},
              {id:'night',name:'✨ 별빛 연구실',bpm:74,pitch:7,wave:'sine',mel:[0,null,7,12,14,null,12,7,9,null,16,14,12,null,9,null,7,12,16,null,19,16,12,null,9,null,7,4,7,null,0,null],bass:[0,9,5,7]},
              {id:'retro',name:'🎮 레트로 마녀의 하루',bpm:126,pitch:0,wave:'square',mel:[0,4,7,12,7,4,0,null,5,9,12,17,12,9,5,null,9,12,16,19,16,12,9,null,7,11,14,19,14,11,7,null],bass:[0,5,9,7]}
            ];
            let trackPitch=0,trackWave='sine';
            let trackId='cozy';
            try { const stored=localStorage.getItem('apothecary_bgm_track'); if(tracks.some(t=>t.id===stored)) trackId=stored; } catch(e){}
            function chooseTrack(id){
              const track=tracks.find(t=>t.id===id)||tracks[0];trackId=track.id;
              melody=track.mel;bassNotes=track.bass;MUSIC_STEP=60/track.bpm/2;trackPitch=track.pitch;trackWave=track.wave;
              musicStep=0;
              if(audioContext) nextMusicTime=audioContext.currentTime+0.2;
              try{localStorage.setItem('apothecary_bgm_track',track.id)}catch(e){}
              document.querySelectorAll('[data-track]').forEach(b=>b.classList.toggle('selected',b.dataset.track===trackId));
            }
            const musicPanel=document.getElementById('musicPanel');
            const musicOptions=document.getElementById('musicOptions');
            musicOptions.innerHTML=tracks.map(t=>`<button type="button" data-track="${t.id}">${t.name}</button>`).join('');
            musicOptions.addEventListener('click',e=>{const b=e.target.closest('[data-track]');if(!b)return;chooseTrack(b.dataset.track);if(!soundEnabled)startSound();});
            document.getElementById('musicSelect').addEventListener('click',()=>{musicPanel.hidden=false;document.getElementById('musicToggle').textContent=soundEnabled?'음악 끄기':'음악 켜기';});
            document.getElementById('musicClose').addEventListener('click',()=>{musicPanel.hidden=true;});
            musicPanel.addEventListener('click',e=>{if(e.target===musicPanel)musicPanel.hidden=true;});
            document.getElementById('musicToggle').addEventListener('click',()=>{if(soundEnabled)stopSound();else startSound();document.getElementById('musicToggle').textContent=soundEnabled?'음악 끄기':'음악 켜기';});
            chooseTrack(trackId);


            function ensureAudio() {
                if (!AudioContextClass) return false;
                if (!audioContext) {
                    audioContext = new AudioContextClass();
                    const compressor = audioContext.createDynamicsCompressor();
                    compressor.threshold.value = -18;
                    compressor.ratio.value = 3;
                    compressor.connect(audioContext.destination);
                    musicBus = audioContext.createGain();
                    effectsBus = audioContext.createGain();
                    musicBus.gain.value = 0.16;
                    effectsBus.gain.value = 0.27;
                    musicBus.connect(compressor);
                    effectsBus.connect(compressor);
                }
                if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
                return true;
            }

            function tone(midi, at, duration, volume = 0.1, wave = 'sine', bus = musicBus) {
                if (!audioContext || !bus) return;
                const oscillator = audioContext.createOscillator();
                const envelope = audioContext.createGain();
                oscillator.type = wave;
                oscillator.frequency.setValueAtTime(noteHz(midi), at);
                envelope.gain.setValueAtTime(0.0001, at);
                envelope.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), at + 0.025);
                envelope.gain.exponentialRampToValueAtTime(0.0001, at + duration);
                oscillator.connect(envelope);
                envelope.connect(bus);
                oscillator.start(at);
                oscillator.stop(at + duration + 0.02);
            }

            function scheduleMusic() {
                if (!soundEnabled || !audioContext || document.hidden) return;
                while (nextMusicTime < audioContext.currentTime + 0.16) {
                    const step = musicStep % melody.length;
                    const phrase = Math.floor(musicStep / 8) % bassNotes.length;
                    const note = melody[step];
                    if (note !== null) tone(72 + note + trackPitch, nextMusicTime, MUSIC_STEP * 1.5, 0.09, trackWave);
                    if (step % 8 === 0) {
                        const root = 48 + bassNotes[phrase];
                        tone(root, nextMusicTime, MUSIC_STEP * 7, 0.07, 'triangle');
                        tone(root + 12, nextMusicTime + 0.08, MUSIC_STEP * 5, 0.025, 'sine');
                    }
                    musicStep++;
                    nextMusicTime += MUSIC_STEP;

                        reaction = guest.lines[chosen] || (good ? '정말 제게 필요했던 감정이에요. 고마워요!' : harmful ? '이 물약은 제 마음을 더 복잡하게 만들었어요…' : helpful ? '조금은 도움이 된 것 같지만, 아직 고민이 남아요.' : '음… 제가 바라던 변화는 아닌 것 같아요.');
                        playEffect(good ? 'good' : harmful ? 'fail' : 'serve');
                        guestMood = good ? 'happy' : harmful ? 'sad' : 'surprised';
                        showReaction(good ? '마음에 꼭 맞는 처방이에요!' : harmful ? '손님이 실망했어요…' : '처방 결과를 확인하세요');
                        coins = Math.max(0, coins + resultDelta); served++; guestIndex++;
                        if(good) missionWins++; awardMission();
                        save(); mode = 'result'; renderModal(); };
                }
                else if (mode === 'result') {
                    const good = chosen === guest.good;
                    modal.innerHTML = `<h2>${good ? '💖 마음이 한결 가벼워졌어요!' : resultKind==='partial' ? '🌱 조금은 도움이 되었어요' : '🌧️ 아쉬운 처방'}</h2><div class="row"><canvas class="portrait" width="48" height="48" aria-label="${guest.name}의 반응 표정"></canvas><div><strong>${guest.name}</strong><div class="note">${item(chosen).icon} ${item(chosen).name}의 물약을 마셨어요</div></div></div><div class="dialogue">“${reaction}”</div><p class="hint">${good ? '정확한 처방 성공!' : resultKind==='partial' ? '부분 성공 · 다음에는 더 잘 맞는 감정을 찾아보세요.' : '처방 실패 · 약국 평판을 위해 더 신중하게 선택하세요.'} ${resultDelta>0?'+':''}${resultDelta}코인</p><button class="action" id="leave">👋 손님 배웅하기</button>`;
                    refreshGuestPortrait(guestMood === 'angry' ? 'surprised' : guestMood === 'sad' ? 'normal' : guestMood);
                    modal.querySelector('#leave').onclick = () => { closeModal(); guestPhase = 'exit'; playEffect('leave'); chosen = null; status.textContent = `${guest.name}님이 약국을 나서고 있어요.`; };
                }
                const dismiss = modal.querySelector('#dismiss');
                if (dismiss)
                    dismiss.onclick = closeModal;
            }
            function renderShop() {
                refreshStock();
                const goods = shopTab==='decor' ? shopGoods.filter(g=>g.category==='decor') : [
                    ...shopGoods.filter(g=>g.category==='potion' && !shopOwned(g.id) && !known.has(g.id)),
                    ...stockIds.map(id=>{const p=rotatingPotions.find(e=>e.id===id);return p&&{...p,category:'potion',name:p.name+'의 물약',desc:'구매 시 새로운 처방과 해당 감정을 찾는 손님 해금'};}).filter(Boolean)
                ];
                modal.innerHTML = `<h2>🏠 마녀의 상점</h2><p>손님을 도와 모은 코인으로 약국을 꾸미고 새로운 이야기를 열어보세요.</p><div class="bar"><span class="shop-balance">💰 ${coins}코인</span><span>${shopTab==='potion'?'새 물약 입고까지 '+restockCountdown():'구매한 인테리어 '+shopGoods.filter(g=>g.category==='decor'&&shopOwned(g.id)).length+'개'}</span></div><div class="shop-tabs"><button type="button" data-tab="decor" class="${shopTab==='decor'?'active':''}">인테리어</button><button type="button" data-tab="potion" class="${shopTab==='potion'?'active':''}">물약</button></div><div class="shop-list">${goods.length?goods.map(g=>`<div class="shop-item"><span class="shop-icon">${g.icon}</span><div class="shop-detail"><strong>${shopEscape(g.name)}</strong><p>${shopEscape(g.desc)}</p></div><button type="button" data-buy="${g.id}" ${shopOwned(g.id)||coins<g.price?'disabled':''}>${shopOwned(g.id)?'구매 완료':g.price+' G'}</button></div>`).join(''):'<p class="hint">현재 판매할 새 물약이 없어요. 다음 입고를 기다려 주세요!</p>'}</div><p class="hint">${shopTab==='potion'?'이미 보유하거나 발견한 물약은 진열되지 않아요. 10분마다 새로운 물약이 입고돼요.':'구매한 가구는 약국에서 직접 사용하거나 보너스를 받을 수 있어요.'}</p><button id="dismiss" type="button">약국으로 돌아가기</button>`;
                modal.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{shopTab=b.dataset.tab;renderShop();});
                modal.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
                    const g=[...shopGoods,...rotatingPotions].find(x=>x.id===b.dataset.buy);
                    if(!g || shopOwned(g.id) || known.has(g.id) && g.category!=='decor' || coins<g.price) return;
                    coins-=g.price; ownedShop.add(g.id);
                    if(g.category==='potion' || rotatingPotions.some(p=>p.id===g.id)) known.add(g.id);
                    stockIds=stockIds.filter(id=>id!==g.id);
                    save(); playEffect('discover'); showReaction(`${g.name} 구매 완료!`); renderShop();
                });
                modal.querySelector('#dismiss').onclick=closeModal;
            }
            setInterval(()=>{if(mode==='shop' && shopTab==='potion') renderShop();},1000);
            document.getElementById('openShop').addEventListener('click',()=>{ if(!opened){shopTab='decor';openModal('shop');} });
            function showReaction(message) { reactionBubble.textContent = message; reactionBubble.classList.add('show'); reactionUntil = performance.now() + 3000; }
            function nearbyUpgrade() {
                if (shopOwned('shelfPlus') && Math.hypot(p.x - 190, p.y - 242) < 125) return 'shelfPlus';
                if (shopOwned('moonLamp') && Math.hypot(p.x - 665, p.y - 205) < 125) return 'moonLamp';
                return null;
            }
            function useUpgrade(id) {
                const today = Math.floor(Date.now() / 86400000);
                if(id === 'shelfPlus') {
                    if(dailyShelfDay === today) { showReaction('진열대는 내일 다시 사용할 수 있어요!'); return; }
                    dailyShelfDay = today; coins += 25; showReaction('진열대 물약 재료 판매! +25코인');
                } else if(id === 'moonLamp') {
                    if(dailyLampDay === today) { showReaction('달빛 축복은 내일 다시 받을 수 있어요!'); return; }
                    dailyLampDay = today; coins += 15; showReaction('달빛 축복! +15코인');
                }
                save(); playEffect('discover');
            }
            function interact() { if (opened) {
                if (mode === 'result') {
                    modal.querySelector('#leave')?.click();
                }
                else
                    closeModal();
                return;
            } const upgrade = nearbyUpgrade(); if(upgrade) { useUpgrade(upgrade); return; } if (guest && guestPhase === 'wait' && Math.hypot(p.x - guest.x, p.y - guest.y) < 112) {
                chosen = null;
                openModal('talk');
                return;
            } if (near) {
                selected = [];
                openModal('research');
            } }
            function update(dt) { focus += (focusTarget - focus) * Math.min(1, dt * 5); frameEl.classList.toggle('focus', focus > .12); if (!opened) {
                let dx = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0), dy = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
                if (dx || dy) {
                    const len = Math.hypot(dx, dy), speed = 170 * dt;
                    dx /= len;
                    dy /= len;
                    const steps = Math.max(1, Math.ceil(speed / 3));
                    for (let stepIndex = 0; stepIndex < steps; stepIndex++) {
                        if (!collide(p.x + dx * speed / steps, p.y)) p.x += dx * speed / steps;
                        if (!collide(p.x, p.y + dy * speed / steps)) p.y += dy * speed / steps;
                    }
                    keepWitchInside();
                    p.walk += dt * 13;
                    if (Math.abs(dx) > Math.abs(dy)) p.dir = dx > 0 ? 2 : 3;
                    else p.dir = dy < 0 ? 1 : 0;
                }
            } keepWitchInside(); if (guest) {
                if (guestPhase === 'enter') {
                    guest.y = Math.max(409, guest.y - dt * 83);
                    if (guest.y <= 409) {
                        guestPhase = 'wait';
                        status.textContent = `💬 ${guest.name}님이 기다리고 있어요. 가까이 가서 대화해 보세요.`;
                    }
                }
                else if (guestPhase === 'exit') {
                    guest.y += dt * 90;
                    if (guest.y > 570) {
                        guest = null; guestMood = 'normal';
                        guestPhase = 'none';
                        callDelay = 8;
                        status.textContent = '손님이 돌아갔어요. 자유롭게 연구하거나 다음 손님을 불러보세요.';
                    }
                }
            }
            else if (!opened) {
                callDelay -= dt;
                if (callDelay <= 0)
                    beginGuest();
            } near = Math.hypot(p.x - 397, p.y - 265) < 111; const upgradeNear = nearbyUpgrade(); const guestNear = !upgradeNear && guest && guestPhase === 'wait' && Math.hypot(p.x - guest.x, p.y - guest.y) < 112; actionButton.textContent = upgradeNear === 'shelfPlus' ? '진열대 사용' : upgradeNear === 'moonLamp' ? '달빛 축복' : guestNear ? '대화하기' : near ? '연구하기' : '다가가 주세요'; actionButton.disabled = opened || !(upgradeNear || guestNear || near); actionButton.classList.toggle('ready', !opened && !!(upgradeNear || guestNear || near)); updateMission(); dayEl.textContent = `DAY ${String(Math.floor(served / 5) + 1).padStart(2, '0')} · 💰 ${coins} · 처방 ${served}회`; miniDay.textContent = `DAY ${String(Math.floor(served / 5) + 1).padStart(2, '0')} · 💰 ${coins}`; if (reactionUntil && performance.now() > reactionUntil) { reactionBubble.classList.remove('show'); reactionUntil = 0; } }
            // Follow-camera: viewport changes without changing the world or collision coordinates.
            // Portrait shows the witch up close; landscape retains the full room.
            let cameraX=400,cameraY=300;
            function drawScene() {
                const portrait=window.matchMedia('(orientation: portrait)').matches;
                const targetWidth=portrait?480:800, targetHeight=portrait?640:576;
                if(c.width!==targetWidth||c.height!==targetHeight){c.width=targetWidth;c.height=targetHeight;ctx.imageSmoothingEnabled=false;}
                ctx.setTransform(1,0,0,1,0,0);
                ctx.fillStyle='#251d2d';ctx.fillRect(0,0,c.width,c.height);
                if(portrait){
                    const scale=1.32;
                    const visibleW=c.width/scale,visibleH=c.height/scale;
                    const aimX=p.x,aimY=p.y+68;
                    cameraX+=(aimX-cameraX)*0.14;
                    cameraY+=(aimY-cameraY)*0.14;
                    cameraX=Math.max(visibleW/2,Math.min(W-visibleW/2,cameraX));
                    cameraY=Math.max(visibleH/2,Math.min(H-visibleH/2,cameraY));
                    ctx.setTransform(scale,0,0,scale,c.width/2-cameraX*scale,c.height/2-cameraY*scale);
                } else {
                    cameraX=p.x;cameraY=p.y;
                    const zoom=1+focus*.35;
                    ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);
                    ctx.translate(-W/2-(focus>0&&guest?(guest.x-W/2)*focus:0),-H/2-(focus>0&&guest?(guest.y-H/2)*focus:0));
                }
                floor();decorations();drawFurniture();cauldron();npc();witch();
                ctx.setTransform(1,0,0,1,0,0);
            }
            function frame(ts) { const dt = Math.min((ts - last) / 1000 || 0, .04); last = ts; time = ts; update(dt); drawScene(); requestAnimationFrame(frame); }
            window.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'w', 'a', 's', 'd'].includes(k) && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) e.preventDefault(); if (k === 'e' && !e.repeat)
                interact();
            else if (k === 'escape' && opened)
                closeModal(); keys.add(k); });
            window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
            window.addEventListener('blur', () => keys.clear());
            document.addEventListener('visibilitychange', () => { if (document.hidden) keys.clear(); });
            // v2.4: Follow the same finger across buttons without requiring a new tap.
            // Native touch events are used because some in-app browsers cancel pointer
            // capture when a finger slides between child buttons.
            const dpad = document.querySelector('.dpad');
            const padButtons = [...dpad.querySelectorAll('button[data-key]')];
            let activeTouchId = null;
            let activeMouse = false;
            let activePadKey = null;
            function changePadDirection(nextKey) {
                if (activePadKey === nextKey) return;
                if (activePadKey) keys.delete(activePadKey);
                activePadKey = nextKey;
                if (nextKey) keys.add(nextKey);
                padButtons.forEach(b => b.classList.toggle('pressed', b.dataset.key.toLowerCase() === nextKey));
            }
            function padDirectionAt(x, y) {
                // Hit the actual key when possible; otherwise use the closest key.
                let best = null, distance = Infinity;
                for (const button of padButtons) {
                    const r = button.getBoundingClientRect();
                    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                    const d = Math.hypot(x - cx, y - cy);
                    if (d < distance) { distance = d; best = button; }
                }
                const r = dpad.getBoundingClientRect();
                // Small tolerance lets the finger travel through button gaps.
                const margin = 24;
                if (x < r.left - margin || x > r.right + margin || y < r.top - margin || y > r.bottom + margin) return null;
                return best ? best.dataset.key.toLowerCase() : null;
            }
            dpad.addEventListener('touchstart', e => {
                if (activeTouchId !== null || !e.changedTouches.length) return;
                const touch = e.changedTouches[0];
                activeTouchId = touch.identifier;
                changePadDirection(padDirectionAt(touch.clientX, touch.clientY));
                e.preventDefault();
            }, { passive:false });
            document.addEventListener('touchmove', e => {
                if (activeTouchId === null) return;
                for (const touch of e.changedTouches) {
                    if (touch.identifier === activeTouchId) {
                        changePadDirection(padDirectionAt(touch.clientX, touch.clientY));
                        e.preventDefault();
                        break;
                    }
                }
            }, { passive:false, capture:true });
            function endPadTouch(e) {
                if (activeTouchId === null) return;
                for (const touch of e.changedTouches) {
                    if (touch.identifier === activeTouchId) {
                        activeTouchId = null;
                        changePadDirection(null);
                        e.preventDefault();
                        break;
                    }
                }
            }
            document.addEventListener('touchend', endPadTouch, { passive:false, capture:true });
            document.addEventListener('touchcancel', endPadTouch, { passive:false, capture:true });
            // Mouse dragging in desktop testing follows the same direction logic.
            dpad.addEventListener('mousedown', e => {
                if (e.button !== 0 || activeTouchId !== null) return;
                activeMouse = true;
                changePadDirection(padDirectionAt(e.clientX, e.clientY));
                e.preventDefault();
            });
            document.addEventListener('mousemove', e => {
                if (activeMouse) changePadDirection(padDirectionAt(e.clientX, e.clientY));
            });
            document.addEventListener('mouseup', () => {
                if (activeMouse) { activeMouse = false; changePadDirection(null); }
            });
            dpad.addEventListener('dragstart', e => e.preventDefault());
            dpad.addEventListener('contextmenu', e => e.preventDefault());
            window.addEventListener('blur', () => { activeTouchId = null; activeMouse = false; changePadDirection(null); });
            actionButton.addEventListener('pointerdown', e => e.preventDefault());
            document.addEventListener('selectstart', e => { if(!e.target.closest('input,textarea')) e.preventDefault(); });
            document.querySelectorAll('.frame .touch button').forEach(button => {
                button.addEventListener('contextmenu', event => event.preventDefault());
            });
            actionButton.onclick = interact;
            document.getElementById('nextGuest').onclick = () => { if (!guest && !opened)
                beginGuest();
            else
                status.textContent = '현재 손님이 약국에 있어요!'; };
            requestAnimationFrame(frame);
        })();
    </script>
