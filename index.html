                    if (!collide(p.x, p.y + dy * speed))
                        p.y += dy * speed;
                    p.walk += dt * 13;
                    p.dir = dy < 0 ? 1 : 0;
                }
            } if (guest) {
                if (guestPhase === 'enter') {
                    guest.y = Math.max(409, guest.y - dt * 83);
                    if (guest.y <= 409) {
                        guestPhase = 'wait';
                        status.textContent = `💬 ${guest.name}님이 기다리고 있어요. 가까이 가서 대화해 보세요.`;
                    }
                }
                else if (guestPhase === 'exit') {
                    guest.y += dt * 90;
                    if (guest.y > 570) {
                        guest = null; guestMood = 'normal';
                        guestPhase = 'none';
                        callDelay = 8;
                        status.textContent = '손님이 돌아갔어요. 자유롭게 연구하거나 다음 손님을 불러보세요.';
                    }
                }
            }
            else if (!opened) {
                callDelay -= dt;
                if (callDelay <= 0)
                    beginGuest();
            } near = Math.hypot(p.x - 397, p.y - 265) < 111; const guestNear = guest && guestPhase === 'wait' && Math.hypot(p.x - guest.x, p.y - guest.y) < 112; actionButton.textContent = guestNear ? '대화하기' : near ? '연구하기' : '다가가 주세요'; actionButton.disabled = opened || !(guestNear || near); actionButton.classList.toggle('ready', !opened && !!(guestNear || near)); updateMission(); dayEl.textContent = `DAY ${String(Math.floor(served / 5) + 1).padStart(2, '0')} · 💰 ${coins} · 처방 ${served}회`; miniDay.textContent = `DAY ${String(Math.floor(served / 5) + 1).padStart(2, '0')} · 💰 ${coins}`; if (reactionUntil && performance.now() > reactionUntil) { reactionBubble.classList.remove('show'); reactionUntil = 0; } }
            function drawScene() { ctx.save(); if (focus > .01) {
                const zoom = 1 + focus * .44;
                const targetX = guest ? guest.x : 397, targetY = guest ? guest.y : 409;
                ctx.translate(W / 2, H / 2);
                ctx.scale(zoom, zoom);
                ctx.translate(-targetX, -targetY + 32);
            } floor(); decorations(); drawFurniture(); cauldron(); npc(); witch();  ctx.restore(); }
            function frame(ts) { const dt = Math.min((ts - last) / 1000 || 0, .04); last = ts; time = ts; update(dt); drawScene(); requestAnimationFrame(frame); }
            window.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'w', 'a', 's', 'd'].includes(k) && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) e.preventDefault(); if (k === 'e' && !e.repeat)
                interact();
            else if (k === 'escape' && opened)
                closeModal(); keys.add(k); });
            window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
            window.addEventListener('blur', () => keys.clear());
            document.addEventListener('visibilitychange', () => { if (document.hidden) keys.clear(); });
            document.querySelectorAll('[data-key]').forEach(b => { const k = b.dataset.key.toLowerCase(); b.addEventListener('pointerdown', e => { e.preventDefault(); b.blur(); keys.add(k); if (b.setPointerCapture) b.setPointerCapture(e.pointerId); }); for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture'])
                b.addEventListener(ev, () => keys.delete(k)); });
            actionButton.addEventListener('pointerdown', e => e.preventDefault());
            document.addEventListener('selectstart', e => { if(!e.target.closest('input,textarea')) e.preventDefault(); });
            document.querySelectorAll('.frame .touch button').forEach(button => {
                button.addEventListener('contextmenu', event => event.preventDefault());
            });
            actionButton.onclick = interact;
            document.getElementById('nextGuest').onclick = () => { if (!guest && !opened)
                beginGuest();
            else
                status.textContent = '현재 손님이 약국에 있어요!'; };
            requestAnimationFrame(frame);
        })();
    </script>
